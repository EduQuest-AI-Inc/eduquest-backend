trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  PYTHON_VERSION: '3.12'

stages:
  - stage: Test
    displayName: 'Run Unit Tests'
    jobs:
      - job: UnitTests
        displayName: 'pytest -m unit'
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            displayName: 'Use Python $(PYTHON_VERSION)'
            inputs:
              versionSpec: '$(PYTHON_VERSION)'
              addToPath: true

          - script: |
              cd eduquest-backend
              python -m venv venv
              source venv/bin/activate
              pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install dependencies'

          - script: |
              cd eduquest-backend
              source venv/bin/activate
              ruff check .
            displayName: 'Lint with ruff'

          - script: |
              cd eduquest-backend
              source venv/bin/activate
              pytest -m unit --tb=short --no-header -q \
                --junitxml=test-results.xml \
                --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing \
                --cov-fail-under=55
            displayName: 'Run unit tests with coverage gate'
            env:
              JWT_SECRET_KEY: test-secret-key
              USE_SUPABASE: 'false'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'eduquest-backend/test-results.xml'
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@1
            displayName: 'Publish coverage report'
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: 'eduquest-backend/coverage.xml'

          - script: |
              cd eduquest-backend
              source venv/bin/activate
              python -c "import json; from main import app; print(json.dumps(app.openapi()))" > /tmp/openapi_fresh.json
              diff ../openapi.json /tmp/openapi_fresh.json
            displayName: 'Verify openapi.json is up to date'
            env:
              JWT_SECRET_KEY: test-secret-key
              USE_SUPABASE: 'false'
