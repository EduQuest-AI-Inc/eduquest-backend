name: Deploy to EC2

on:
  push:
    branches:
      - production  # or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Decode SSH key
      run: |
        echo "${{ secrets.EC2_KEY }}" | base64 -d > ec2_key.pem
        chmod 600 ec2_key.pem

    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          cd /home/ubuntu/eduquest-backend
          echo "Pulling latest changes..."
          git clean -f
          git pull origin production

          echo "Activating virtual environment..."
          source venv/bin/activate
          pip install -r requirements.txt

          echo "Verifying imports..."
          venv/bin/python -c "import main; print('Import OK')"

          echo "Stopping existing backend process (if any)..."
          pkill -f "uvicorn main:app" || true
          pkill -f "python app.py" || true  # legacy Flask cleanup
          sleep 2

          echo "Checking for port conflicts..."
          fuser 8000/tcp && echo "WARNING: port 8000 still in use" || echo "Port 8000 is free"

          echo "Starting FastAPI app (uvicorn) in background..."
          truncate -s 0 /home/ubuntu/eduquest-backend/app.log
          PYTHONUNBUFFERED=1 nohup venv/bin/python -u -m uvicorn main:app --host 0.0.0.0 --port 8000 > /home/ubuntu/eduquest-backend/app.log 2>&1 &
          UVICORN_PID=$!
          disown
          echo "Waiting for server (pid=$UVICORN_PID)..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/helloworld 2>/dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            if ! kill -0 $UVICORN_PID 2>/dev/null; then
              echo "Uvicorn process died (pid=$UVICORN_PID)"
              break
            fi
            if [ "$i" = "5" ]; then
              echo "--- app.log after 5s ---"
              cat /home/ubuntu/eduquest-backend/app.log
            fi
            sleep 1
          done
          echo "--- app.log at failure ---"
          cat /home/ubuntu/eduquest-backend/app.log
          ss -tlnp | grep 8000 || echo "Nothing listening on 8000"
          exit 1
        EOF