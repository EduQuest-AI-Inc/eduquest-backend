name: Deploy to EC2

on:
  push:
    branches:
      - production  # or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Decode SSH key
      run: |
        echo "${{ secrets.EC2_KEY }}" | base64 -d > ec2_key.pem
        chmod 600 ec2_key.pem

    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          cd /home/ubuntu/eduquest-backend
          echo "Pulling latest changes..."
          git clean -f
          git pull origin production

          echo "Activating virtual environment..."
          source venv/bin/activate
          pip install -r requirements.txt

          echo "Verifying imports..."
          venv/bin/python -c "import main; print('Import OK')"

          echo "Stopping existing backend process (if any)..."
          pkill -f "uvicorn main:app" || true
          pkill -f "python app.py" || true  # legacy Flask cleanup
          sleep 1

          echo "Starting FastAPI app (uvicorn) in background..."
          nohup venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
          disown
          echo "Waiting for server..."
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/helloworld 2>/dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start after 15s"
          cat app.log
          exit 1
        EOF